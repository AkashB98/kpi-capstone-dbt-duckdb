version: 2

sources:
  - name: raw
    schema: raw
    description: "Synthetic Helios Home data, generated by generate_sources.py and loaded by load_raw.py. No real company data."
    tables:
      - name: orders
        description: "One row per order: gross / discount / refund in integer cents."
        loaded_at_field: loaded_at
        freshness:
          warn_after: { count: 24, period: hour }
          error_after: { count: 72, period: hour }
        columns:
          - name: order_id
            data_tests:
              - unique
              - not_null
          - name: order_date
            data_tests:
              - not_null
          - name: status
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["completed", "refunded", "partially_refunded"]
      - name: daily_traffic
        description: "Visitors and sessions per store per day."
        loaded_at_field: loaded_at
        freshness:
          warn_after: { count: 24, period: hour }
          error_after: { count: 72, period: hour }
      - name: stores
        description: "Store reference as loaded. Region for S4 changes on 2026-02-15; history is kept by the stores_snapshot."
